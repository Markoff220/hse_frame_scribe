# VideoNotes: самодостаточный стек, GPU-профиль (RTX 2080 Ti).
# `docker compose up -d --build` поднимает сервисы без скачивания моделей:
#   ollama      — LLM/VLM-сервер с GPU (внутри стека, хостовый Ollama не нужен)
#   pipeline    — web-сервис (ffmpeg + GigaAM на CUDA + кадры + конспект)
# Модели выбираются и скачиваются в разделе «Настройки моделей» веб-интерфейса.
#
# Требуется NVIDIA Container Toolkit на хосте (pacman: nvidia-container-toolkit).
# CPU-профиль: закомментируйте блоки `deploy:` ниже и см. комментарии в .env.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: videonotes-ollama
    volumes:
      - ollama-models:/root/.ollama
    # GPU (NVIDIA): требует NVIDIA Container Toolkit на хосте
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  pipeline:
    build:
      context: .
      args:
        # torch берётся с PyPI (CUDA-сборка cu130, подходит драйверу хоста).
        # Для старых драйверов: PYTORCH_INDEX=https://download.pytorch.org/whl/cu124
        PYTORCH_INDEX: ${PYTORCH_INDEX:-https://pypi.org/simple}
    image: videonotes:latest
    container_name: videonotes
    ports:
      - "${PORT:-8090}:8090"
    environment:
      VIDEONOTES_CONFIG: /app/config/docker.json
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      # Результаты всегда лежат рядом с проектом в ./output.
      OUTPUT_HOST_DIR: ./output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # GPU (NVIDIA): требует NVIDIA Container Toolkit на хосте
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ./config/docker.json:/app/config/docker.json:ro
      - gigaam-models:/app/runtime/models/gigaam
      - ./runtime/tmp:/app/runtime/tmp
      - ./runtime/logs:/app/runtime/logs
      - ./output:/app/output
    restart: unless-stopped

volumes:
  gigaam-models:
  ollama-models:
